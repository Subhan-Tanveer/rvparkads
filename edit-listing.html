<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <title>Edit Listing — RVParkAds.com</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="logo-stack">
        <a href="index.html" class="logo-img-link"><img src="/images/transparent-logo.png" alt="RVParkAds.com" class="logo-img"></a>
        <a href="https://www.rvparksales.com" target="_blank" rel="noopener" class="logo-affiliate-note">Also marketing on <strong>RVParkSales.com</strong></a>
      </div>
      <span id="accountSlot"></span>
    </div>
  </header>

  <div id="loadingState" class="listing-status">
    <p class="lede">Loading listing…</p>
  </div>

  <div id="errorState" class="listing-status error" style="display:none;">
    <h2>Something went wrong</h2>
    <p class="lede" id="errorMessage"></p>
    <p><a href="dashboard.html" class="btn btn-primary" style="margin-top:24px;"><span>Back to Dashboard</span></a></p>
  </div>

  <main class="listing-shell" id="editShell" style="display:none;">
    <a href="dashboard.html" class="hint" style="display:inline-block; margin-bottom:16px;">&larr; Back to Dashboard</a>

    <div class="section-head" style="text-align:left; margin-bottom:24px;">
      <p class="eyebrow" id="planLabel"></p>
      <h2 id="listingNameHeading"></h2>
      <p class="lede" id="modeMessage"></p>
    </div>

    <div class="dash-card" id="detailsCard">
      <h3>Listing Details</h3>
      <form id="detailsForm">
        <div class="form-grid">
          <div class="form-field full"><label for="listingName" id="listingNameLabel">Park Name *</label><input id="listingName" name="listingName" required></div>
          <div class="form-field full"><label for="listingAddress" id="listingAddressLabel">Park Address *</label><input id="listingAddress" name="listingAddress" required></div>

          <div id="parkFields" style="display:contents;">
            <div class="form-field"><label for="numSites">Number of Sites</label><input id="numSites" name="numSites" type="number" min="0"></div>
            <div class="form-field"><label for="rvSpaces">RV Spaces</label><input id="rvSpaces" name="rvSpaces" type="number" min="0"></div>
            <div class="form-field"><label for="fullHookupSpaces">Full Hook Up Spaces</label><input id="fullHookupSpaces" name="fullHookupSpaces" type="number" min="0"></div>
            <div class="form-field"><label for="tentSpaces">Tent Sites</label><input id="tentSpaces" name="tentSpaces" type="number" min="0"></div>
            <div class="form-field"><label for="cabins">Cabins</label><input id="cabins" name="cabins" type="number" min="0"></div>
            <div class="form-field"><label for="yurts">Yurts</label><input id="yurts" name="yurts" type="number" min="0"></div>

            <div class="form-field full">
              <label>Rental Type <span class="hint">(optional — select all that apply)</span></label>
              <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" name="rentalTypes" value="Nightly"> Nightly</label>
                <label class="checkbox-item"><input type="checkbox" name="rentalTypes" value="Weekly"> Weekly</label>
                <label class="checkbox-item"><input type="checkbox" name="rentalTypes" value="Monthly"> Monthly</label>
              </div>
            </div>

            <div class="form-field"><label for="annualRevenue">Annual Revenue (USD)<span class="hint"> — optional</span></label><input id="annualRevenue" name="annualRevenue" type="number" min="0" step="1000" placeholder="e.g. 320000"></div>
            <div class="form-field"><label for="occupancyRate">Occupancy Rate (%)<span class="hint"> — optional</span></label><input id="occupancyRate" name="occupancyRate" type="number" min="0" max="100" step="1"></div>
            <div class="form-field"><label for="reservationSystem">Reservation System Used<span class="hint"> — optional</span></label><input id="reservationSystem" name="reservationSystem"></div>

            <div class="form-field full">
              <label>Amenities <span class="hint">(optional)</span></label>
              <div class="checkbox-grid" id="parkAmenities">
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Office"> Office</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Clubhouse"> Clubhouse</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Laundry / Bath House"> Laundry / Bath House</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="30 Amp"> 30 Amp</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="50 Amp"> 50 Amp</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Dog Park"> Dog Park</label>
              </div>
            </div>

            <div class="form-field full">
              <label>Park Features <span class="hint">(optional)</span></label>
              <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" name="features" value="Waterfront / River / Lake / Ocean"> Waterfront / River / Lake / Ocean</label>
                <label class="checkbox-item"><input type="checkbox" name="features" value="Near Major Interstate or State Highway"> Near Major Interstate or State Highway</label>
                <label class="checkbox-item"><input type="checkbox" name="features" value="Pool"> Pool</label>
                <label class="checkbox-item"><input type="checkbox" name="features" value="Rec Room"> Rec Room</label>
                <label class="checkbox-item"><input type="checkbox" name="features" value="Playground / Games Area"> Playground / Games Area</label>
                <label class="checkbox-item"><input type="checkbox" name="features" value="Picnic Area"> Picnic Area</label>
                <label class="checkbox-item"><input type="checkbox" name="features" value="Fire Pits"> Fire Pits</label>
              </div>
            </div>

            <div class="form-field full">
              <label>Seller Considerations <span class="hint">(optional)</span></label>
              <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="ownerFinancingPark" name="ownerFinancing"> Owner financing considered</label>
                <label class="checkbox-item"><input type="checkbox" id="expansionLand" name="expansionLand"> Extra land available for expansion</label>
              </div>
            </div>
          </div>

          <div id="lotFields" style="display:none;">
            <div class="form-field"><label for="lotSize">Lot Size<span class="hint"> — optional</span></label><input id="lotSize" name="lotSize" placeholder="e.g. 40ft x 60ft or 2,400 sq ft"></div>
            <div class="form-field"><label for="hoaFees">HOA Fees (USD/month)<span class="hint"> — optional</span></label><input id="hoaFees" name="hoaFees" type="number" min="0" step="1"></div>

            <div class="form-field full">
              <label>Amenities <span class="hint">(optional)</span></label>
              <div class="checkbox-grid" id="lotAmenities">
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Storage Building"> Storage Building</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Laundry"> Laundry</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Pool"> Pool</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Pickleball Court"> Pickleball Court</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Bocce Ball"> Bocce Ball</label>
                <label class="checkbox-item"><input type="checkbox" name="amenities" value="Tennis"> Tennis</label>
              </div>
            </div>

            <div class="form-field full">
              <label for="communityActivities">Community Activities<span class="hint"> — optional</span></label>
              <textarea id="communityActivities" name="communityActivities" rows="3" placeholder="Describe the community's regular activities and events."></textarea>
            </div>

            <div class="form-field full">
              <label>Seller Considerations <span class="hint">(optional)</span></label>
              <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="ownerFinancingLot" name="ownerFinancing"> Owner financing considered</label>
              </div>
            </div>
          </div>

          <div class="form-field"><label for="askingPrice">Asking Price (USD)<span class="hint"> — optional</span></label><input id="askingPrice" name="askingPrice" type="number" min="0" step="1000" placeholder="e.g. 1250000"></div>

          <div class="form-field full">
            <label for="description" id="descriptionLabel">Park Description <span class="hint">(optional)</span></label>
            <textarea id="description" name="description" rows="4" placeholder="Tell buyers what makes this listing worth owning."></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="saveDetailsBtn" style="width:100%; margin-top:8px;"><span>Save Details</span></button>
        <div class="form-alert" id="detailsAlert"></div>
      </form>
    </div>

    <div class="dash-card">
      <h3>Photos <span class="hint" id="photoCountHint"></span></h3>
      <div class="file-preview-grid" id="photosGrid" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));"></div>
      <div class="file-drop" id="photoDrop" style="margin-top:16px;">
        <input type="file" id="photoInput" accept="image/*" multiple style="margin-bottom:8px;">
        <p>JPEG, PNG, WebP, or GIF — up to 8MB each</p>
      </div>
      <div class="file-preview-grid" id="newPhotoPreview" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); margin-top:8px;"></div>
    </div>

    <div class="dash-card" id="videosCard">
      <h3>Videos <span class="hint" id="videoCountHint"></span></h3>
      <div class="file-preview-grid" id="videosGrid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));"></div>
      <div class="file-drop" id="videoDrop" style="margin-top:16px;">
        <input type="file" id="videoInput" accept="video/*" multiple style="margin-bottom:8px;">
        <p>MP4, MOV, or WebM — up to 200MB each</p>
      </div>
      <div class="file-preview-grid" id="newVideoPreview" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top:8px;"></div>
    </div>

    <button type="button" class="btn btn-primary" id="saveBtn" style="width:100%;"><span>Save Changes</span></button>
    <div class="form-alert" id="formAlert"></div>
  </main>

  <script type="module" src="/src/js/edit-listing.js"></script>
</body>
</html>
